version: 1
schema: public
tables:
  - name: customers
    columns:
      - name: id
        type: bigint
        nullable: false
      - name: customer_name
        type: text
        nullable: false
      - name: email
        type: text
        nullable: true
    primary_key: [id]
    indexes:
      - name: customers_email_idx
        columns: [email]
