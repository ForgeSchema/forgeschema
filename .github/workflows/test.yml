name: test
# release.yml listens for this workflow by name; keep it "test".
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16.10", "17.6"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: forgeschema
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: forgeschema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeschema -d forgeschema_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FORGESCHEMA_TEST_DATABASE_URL: postgres://forgeschema:local_test_only@localhost:5432/forgeschema_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -v ./...
      - run: go vet ./...
      - run: go build -o bin/forgeschema ./cmd/forgeschema
      - run: ./bin/forgeschema validate examples/customers.yaml
      - name: Run fresh-checkout walkthrough
        env:
          FORGESCHEMA_DEMO_DATABASE_URL: ${{ env.FORGESCHEMA_TEST_DATABASE_URL }}
        run: sh scripts/demo.sh --output demo-output --emit-bundle
      - name: Save walkthrough artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-postgres-${{ matrix.postgres }}
          path: demo-output/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # Database tests skip without FORGESCHEMA_TEST_DATABASE_URL.
      - run: go test -count=1 ./...
      - run: go build -o bin/forgeschema ./cmd/forgeschema
      - run: sh scripts/smoke.sh bin/forgeschema "$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/cli/cli.go)"

  release-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release-plan-test.py

  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recorded demo data
        run: python3 scripts/export-browser-demo.py --check
      - name: Check demo interactions and downloads
        run: node --test web/demo/demo.test.cjs
      - run: node --check web/demo/demo.js
