name: release

# Releases go out on their own. When the test workflow passes on a push to
# main and the Version in internal/cli/cli.go has no tag yet, this workflow
# builds the six archives, smoke-tests the binaries on Linux (x86-64 and
# ARM), macOS (Apple silicon) and Windows (x86-64), then tags the commit and
# publishes the release "ForgeSchema vX.Y.Z" with the archives and
# SHA256SUMS. Nothing goes public unless every build and check passes.
# scripts/release-plan.py has the rules, RELEASING.md the procedure.
#
# It also attaches binaries to a release published by hand, and can be run
# by hand with a tag to rebuild that tag's files.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, such as v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-plan.py

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: forgeschema-archives
          path: dist/*
          if-no-files-found: error

  # Each binary runs on its own kind of machine. macOS on Intel is
  # cross-compiled and not run, as GitHub's Intel macOS runners are going away.
  check:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: forgeschema_linux_arm64.tar.gz
            runner: ubuntu-24.04-arm
          - archive: forgeschema_darwin_arm64.tar.gz
            runner: macos-latest
          - archive: forgeschema_windows_amd64.zip
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: forgeschema-archives
          path: dist
      - name: Unpack and smoke-test
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -eu
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/cli/cli.go)
          mkdir unpacked
          case "$ARCHIVE" in
            *.zip) unzip -q "dist/$ARCHIVE" -d unpacked; bin=$(ls unpacked/*/forgeschema.exe) ;;
            *) tar -xzf "dist/$ARCHIVE" -C unpacked; bin=$(ls unpacked/*/forgeschema) ;;
          esac
          sh scripts/smoke.sh "$bin" "$version"
          echo "::notice title=$ARCHIVE::smoke test passed for $version"

  release:
    needs: [plan, build, check]
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forgeschema-archives
          path: dist
      - name: Check the files and write the notes
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(ls | wc -l)" -eq 7
          cat > ../notes.md <<'NOTES'
          Ready-built forgeschema binaries. Each archive holds the `forgeschema` command, its licence files and the reference guides.

          | System | File |
          |---|---|
          | Linux, x86-64 | forgeschema_linux_amd64.tar.gz |
          | Linux, ARM64 | forgeschema_linux_arm64.tar.gz |
          | macOS, Apple silicon | forgeschema_darwin_arm64.tar.gz |
          | macOS, Intel | forgeschema_darwin_amd64.tar.gz |
          | Windows, x86-64 | forgeschema_windows_amd64.zip |
          | Windows, ARM64 | forgeschema_windows_arm64.zip |

          SHA256SUMS lists the checksums. The macOS and Windows binaries aren't signed, so macOS may ask you to allow them the first time, or run `xattr -d com.apple.quarantine forgeschema`. What changed is on https://forgeschema.com.
          NOTES
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "ForgeSchema $TAG" --notes-file ../notes.md --latest ./*
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
