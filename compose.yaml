services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: forgeschema
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: forgeschema_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./testdata/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeschema -d forgeschema_test"]
      interval: 2s
      timeout: 3s
      retries: 30
